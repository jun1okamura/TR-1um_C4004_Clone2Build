project:
  title: "C4004 - Intel 4004 Compatible 4-bit CPU (Trial 05: Lookahead Registered I/O + Zero-Gate-Delay X1 Pre-Read CLA)"
  description: "Full-custom/stdcell hybrid Intel 4004 CPU with 128-bit SRAM128 macro, 1-cycle lookahead registered outputs (sync, cm_rom, d_hiz, d_oe), direct MUXDFFRB X1 pre-read pipeline, non-stop Shadow PC, 11-row GCell-channel floorplan, and 0-DRC 2-metal routing on OpenSUSI TR-1um CMOS"
  author: "Junichi Okamura"
  github_id: "jun1okamura"
  organization: "OpenSUSI / TR-1um PDK"
  process: "OpenSUSI TR-1um (1um 2-Metal CMOS, 5.0V)"
  die_size_um: "2500 x 2500"
  top_cell: "OSS_FRAME"
  gds_file: "src/tr_1um_jun1okamura.gds"
  submission_gds: "src/IP62_jun1okamura.gds"
  spice_file: "src/tr_1um_jun1okamura.cir"
  pins:
    P1:  "clk (INPUT, North)"
    P2:  "sync (OUTPUT, North)"
    P3:  "D[3] (INOUT, West)"
    P4:  "D[2] (INOUT, West)"
    P5:  "D[1] (INOUT, West)"
    P6:  "D[0] (INOUT, West)"
    P7:  "rst (INPUT, South)"
    P8:  "VSS (GROUND, South)"
    P9:  "d_oe (OUTPUT, South)"
    P10: "test (INPUT, South)"
    P11: "cm_ram[0] (OUTPUT, East)"
    P12: "cm_ram[1] (OUTPUT, East)"
    P13: "cm_ram[2] (OUTPUT, East)"
    P14: "cm_ram[3] (OUTPUT, East)"
    P15: "cm_rom (OUTPUT, North)"
    P16: "VDD (POWER 5.0V, North)"
